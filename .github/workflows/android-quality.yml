name: Android Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-quality:
    name: Unit, lint, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run local quality gates
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
